<!DOCTYPE.html>
<html langu="en">
<head>
<meta charset="UTF-8">
<title>ORDER NOW</title>
<link rel="stylesheet" href="style.css">
<style>
    body{background: transparent;
    background-image: url(images/order.jpg);
    background-position: center;
    background-size: cover;}
</style>
</head>
<body>
<header><div class="hero">
<h3>Melovia Cafe- Place Your Order</h3>
<a class="home-btn" href="index.html">Back to Home</a></div>
</header>
<form>
<div class="order-card">
<label>Your Name:</label><br>
<input type="text"name"placeholder"="Enter Your Name"required"><br><br>

<label>Phone Number:</label><br>
<input type="tel"name="phone"placeholder="07xxxxxxxx"require><br><br>

<label>What Do You Want to Order?</label><br>
<textarea name="order"placeholder="E.g. 2 Lattes and 1 chicken wrap"required></textarea><br><br>

<label>Delivery Address:</label><br>
<input type="text"name="address"placeholder="E.g. Kololo,Kampala"><br><br>

<label>Delivery or Takeaway?</label><br>
<select name="type">
<option>Delivery</option>
<option>Takeaway</option>
<option>Dine-in</option>
</select><br><br>
</div>
<button type="submit" class="place-order-btn">Place Order</button></form>

</body>
</html>
